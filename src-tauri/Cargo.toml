[package]
name = "punakawan"
version = "0.1.0"
description = "Local design workspace"
authors = ["Punakawan"]
edition = "2021"

[lib]
name = "punakawan_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = "0.22"
fontdb = "0.23"
roxmltree = "0.20"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tempfile = "3"
uuid = "1"
